name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - run: gradle build
        working-directory: tear-exclusivo-github

      - uses: actions/upload-artifact@v4
        with:
          name: tear-exclusivo-mod
          path: |
            tear-exclusivo-github/build/libs/*.jar
            !tear-exclusivo-github/build/libs/*-sources.jar
