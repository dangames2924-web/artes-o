name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Compilar (procura a pasta do projeto sozinho)
        run: |
          echo "Arquivos .java encontrados:"
          find . -name '*.java'
          JAVA_DIR=$(find . -type d -path '*src/main/java' | head -n 1)
          if [ -z "$JAVA_DIR" ]; then
            echo "ERRO: nenhuma pasta src/main/java encontrada no repositorio"
            exit 1
          fi
          PROJETO=$(dirname "$(dirname "$(dirname "$JAVA_DIR")")")
          echo "Projeto em: $PROJETO"
          cd "$PROJETO"
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: tear-exclusivo-mod
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
